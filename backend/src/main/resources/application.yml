spring:
  application:
    name: marketradar
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/marketradar}
    username: ${DB_USUARIO:marketradar}
    password: ${DB_CLAVE:marketradar}
    hikari:
      maximum-pool-size: 10
      pool-name: marketradar-pool
  flyway:
    locations: classpath:db/migration
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null

server:
  port: ${PUERTO:8080}
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /api/docs

marketradar:
  modo-desarrollo: ${MODO_DESARROLLO:false}
  busqueda:
    timeout-segundos: 4
    cache-minutos: 15
    tamano-maximo: 20
    hilos: 6
  cors:
    origenes-permitidos: ${CORS_ORIGENES:http://localhost:8080}
  moneda:
    destino: COP
    # La TRM del dólar se consulta cada día en datos abiertos (Superintendencia Financiera) y las demás
    # monedas en ExchangeRate-API. Si no responden, se usa la última guardada y, si no hay, esta de respaldo.
    tasa-usd-cop: ${TASA_USD_COP:4000}
    fecha-tasa: ${FECHA_TASA:2026-10-28}
    url-trm: https://www.datos.gov.co/resource/32sa-8pi3.json?$order=vigenciadesde%20DESC&$limit=1
    url-tasas-internacionales: https://open.er-api.com/v6/latest/USD
    monedas-adicionales: EUR,BRL,MXN,CNY,GBP
    cron-actualizacion: "0 0 6 * * *"
  mvp:
    # Pesos para elegir la mejor opción de compra (deben sumar 1).
    peso-precio: 0.6
    peso-calificacion: 0.3
    peso-envio: 0.1
    resenas-minimas: 20
  marketplaces:
    aliexpress:
      habilitado: ${ALIEXPRESS_HABILITADO:false}
      app-key: ${ALIEXPRESS_APP_KEY:}
      app-secret: ${ALIEXPRESS_APP_SECRET:}
      tracking-id: ${ALIEXPRESS_TRACKING_ID:}
    shopify:
      habilitado: ${SHOPIFY_HABILITADO:false}
      token: ${SHOPIFY_TOKEN:}
    mercadolibre:
      habilitado: ${MERCADOLIBRE_HABILITADO:false}
      client-id: ${MERCADOLIBRE_CLIENT_ID:}
      client-secret: ${MERCADOLIBRE_CLIENT_SECRET:}
  asistente:
    # Proveedor de IA del chatbot: pendiente de decisión del equipo.
    proveedor: ${ASISTENTE_PROVEEDOR:ninguno}
    api-key: ${ASISTENTE_API_KEY:}
  administrador:
    # Cuenta de administrador que se crea al arrancar si no existe. La clave debe ser segura.
    correo: ${ADMIN_CORREO:}
    clave: ${ADMIN_CLAVE:}
    nombres: ${ADMIN_NOMBRES:Administrador}
    apellidos: ${ADMIN_APELLIDOS:Marketradar}
