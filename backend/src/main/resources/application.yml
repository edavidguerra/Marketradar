spring:
  application:
    name: marketradar
  datasource:
    # DB_URL completa, o sus partes por separado (así las entrega Render en render.yaml).
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PUERTO:5432}/${DB_NOMBRE:marketradar}}
    username: ${DB_USUARIO:marketradar}
    password: ${DB_CLAVE:marketradar}
    hikari:
      maximum-pool-size: 10
      pool-name: marketradar-pool
  flyway:
    locations: classpath:db/migration
  http:
    client:
      connect-timeout: 5s
      read-timeout: 20s
  web:
    resources:
      cache:
        # CSS, JavaScript, fuente e íconos: el navegador los guarda y solo pregunta si cambiaron (respuesta 304).
        cachecontrol:
          no-cache: true
          cache-public: true
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null

server:
  port: ${PUERTO:8080}
  # Comprime las respuestas de texto: la página y los resultados pesan unas 4 veces menos.
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,text/javascript,application/javascript,image/svg+xml
    min-response-size: 1KB
  # Detrás del proxy de Render (HTTPS) respeta las cabeceras X-Forwarded-*.
  forward-headers-strategy: framework
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /api/docs

marketradar:
  modo-desarrollo: ${MODO_DESARROLLO:false}
  busqueda:
    # Google Shopping (SerpApi) puede tardar varios segundos en responder.
    timeout-segundos: ${BUSQUEDA_TIMEOUT_SEGUNDOS:8}
    # Una búsqueda repetida en la siguiente hora sale de la memoria: es instantánea y no gasta SerpApi.
    cache-minutos: ${BUSQUEDA_CACHE_MINUTOS:60}
    tamano-maximo: 20
    hilos: 6
  cors:
    origenes-permitidos: ${CORS_ORIGENES:http://localhost:8080}
  moneda:
    destino: COP
    # La TRM del dólar se consulta cada día en datos abiertos (Superintendencia Financiera) y las demás
    # monedas en ExchangeRate-API. Si no responden, se usa la última guardada y, si no hay, esta de respaldo.
    tasa-usd-cop: ${TASA_USD_COP:4000}
    fecha-tasa: ${FECHA_TASA:2026-10-28}
    url-trm: https://www.datos.gov.co/resource/32sa-8pi3.json?$order=vigenciadesde%20DESC&$limit=1
    url-tasas-internacionales: https://open.er-api.com/v6/latest/USD
    monedas-adicionales: EUR,BRL,MXN,CNY,GBP
    cron-actualizacion: "0 0 6 * * *"
  mvp:
    # Pesos para elegir la mejor opción de compra (deben sumar 1).
    peso-precio: 0.6
    peso-calificacion: 0.3
    peso-envio: 0.1
    resenas-minimas: 20
  marketplaces:
    aliexpress:
      habilitado: ${ALIEXPRESS_HABILITADO:false}
      app-key: ${ALIEXPRESS_APP_KEY:}
      app-secret: ${ALIEXPRESS_APP_SECRET:}
      tracking-id: ${ALIEXPRESS_TRACKING_ID:}
    shopify:
      habilitado: ${SHOPIFY_HABILITADO:false}
      token: ${SHOPIFY_TOKEN:}
    mercadolibre:
      habilitado: ${MERCADOLIBRE_HABILITADO:false}
      client-id: ${MERCADOLIBRE_CLIENT_ID:}
      client-secret: ${MERCADOLIBRE_CLIENT_SECRET:}
      refresh-token: ${MERCADOLIBRE_REFRESH_TOKEN:}
      archivo-token: ${MERCADOLIBRE_ARCHIVO_TOKEN:}
      url-api: https://api.mercadolibre.com
      sitio: MCO
      resenas-por-busqueda: 5
    google-shopping:
      # Precios reales de muchas tiendas colombianas con SerpApi (ver docs/integraciones/google-shopping.md).
      habilitado: ${SERPAPI_HABILITADO:false}
      api-key: ${SERPAPI_API_KEY:}
      url-api: https://serpapi.com
  ia-busqueda:
    # Gemini (Google AI Studio, plan gratis) entiende lo que se busca, deja solo los productos que sí son lo buscado
    # y escribe un resumen como el de Google. Sin clave, la búsqueda funciona igual con los filtros propios.
    habilitado: ${GEMINI_HABILITADO:true}
    api-key: ${GEMINI_API_KEY:}
    modelo: ${GEMINI_MODELO:gemini-3.5-flash-lite}
    url: https://generativelanguage.googleapis.com
  asistente:
    # Chatbot con Claude (API de Anthropic). "ninguno" apaga el chatbot.
    proveedor: ${ASISTENTE_PROVEEDOR:claude}
    api-key: ${ASISTENTE_API_KEY:}
    modelo: ${ASISTENTE_MODELO:claude-opus-5-5}
  correo:
    # Servidor de correo (SMTP) para los avisos de los seguimientos. Sin SMTP_HOST y CORREO_REMITENTE no se manda
    # ningún correo: los avisos quedan pendientes y la página lo dice. Ver docs/seguimientos.md.
    host: ${SMTP_HOST:}
    puerto: ${SMTP_PUERTO:587}
    usuario: ${SMTP_USUARIO:}
    clave: ${SMTP_CLAVE:}
    remitente: ${CORREO_REMITENTE:}
    nombre-remitente: ${CORREO_NOMBRE_REMITENTE:Marketradar}
    starttls: ${SMTP_STARTTLS:true}
    ssl: ${SMTP_SSL:false}
    timeout-segundos: 10
    # Dirección pública de la página, para los enlaces de los correos. En Render se toma sola de RENDER_EXTERNAL_URL.
    url-publica: ${URL_PUBLICA:${RENDER_EXTERNAL_URL:http://localhost:8080}}
  seguimientos:
    # Tarea del servidor que revisa los precios de las ofertas seguidas. Cuida la cuota de SerpApi (250 al mes).
    habilitado: ${SEGUIMIENTOS_HABILITADO:true}
    frecuencia-minutos: ${SEGUIMIENTOS_FRECUENCIA_MINUTOS:720}
    revisar-cada-minutos: ${SEGUIMIENTOS_REVISAR_CADA_MINUTOS:15}
    max-seguimientos-por-ronda: 25
    max-consultas-por-ronda: ${SEGUIMIENTOS_CONSULTAS_POR_RONDA:5}
    baja-minima-porcentaje: ${SEGUIMIENTOS_BAJA_MINIMA_PORCENTAJE:1}
    max-intentos-correo: 3
    horas-vigencia-aviso: 48
    max-por-usuario: 20
    # Clave para que un cron externo despierte la tarea (POST /api/v1/tareas/seguimientos). Vacía, la ruta no existe.
    token-tareas: ${TAREAS_TOKEN:}
  mayoristas:
    # Compras al por mayor en Alibaba con API.SH (https://api.sh). La clave va en APISH_KEY; sin ella el apartado
    # "Al por mayor" lo dice y no consulta nada. Ver docs/integraciones/alibaba-apish.md.
    api-key: ${APISH_KEY:}
    url-api: ${APISH_URL:https://api.api.sh}
    # API.SH guarda cada respuesta 24 horas y cobra igual las repetidas: aquí se guardan 6 horas para no gastar créditos.
    cache-horas: ${APISH_CACHE_HORAS:6}
    paginas-maximas: 3
    detalles-por-busqueda: ${APISH_DETALLES_POR_BUSQUEDA:4}
    consultas-por-dia: ${APISH_CONSULTAS_POR_DIA:200}
    timeout-segundos: 60
  administrador:
    # Cuenta de administrador que se crea al arrancar si no existe. La clave debe ser segura.
    correo: ${ADMIN_CORREO:}
    clave: ${ADMIN_CLAVE:}
    nombres: ${ADMIN_NOMBRES:Administrador}
    apellidos: ${ADMIN_APELLIDOS:Marketradar}
