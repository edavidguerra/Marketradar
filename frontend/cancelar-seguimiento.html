<!doctype html>
<html lang="es-CO">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex">
    <title>Dejar de seguir un producto · Marketradar</title>
    <meta name="description" content="Deje de recibir avisos de precio de un producto.">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preload" href="fuentes/atkinson-hyperlegible-next.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="css/estilos.css">
    <script type="module" src="js/enlaces/enlace.js"></script>
</head>
<body data-accion="cancelar">
<a class="saltar" href="#contenido">Ir al contenido</a>

<header class="encabezado">
    <div class="contenedor encabezado-interno">
        <a class="marca" href="./"><img src="favicon.svg" alt="" width="40" height="40"> Marketradar<span class="solo-lectores">, ir al inicio</span></a>
        <div class="herramientas" role="group" aria-label="Tamaño de letra y contraste">
            <button type="button" class="boton boton-chip" id="letra-menos" aria-label="Letra más pequeña">A−</button>
            <button type="button" class="boton boton-chip" id="letra-mas" aria-label="Letra más grande">A+</button>
            <button type="button" class="boton boton-chip" id="contraste" aria-pressed="false"><svg class="icono" aria-hidden="true" focusable="false"><use href="img/iconos.svg#contraste"></use></svg> Alto contraste</button>
        </div>
    </div>
</header>

<main id="contenido" class="contenedor enlace-correo" tabindex="-1">
    <h1 tabindex="-1">Dejar de seguir un producto</h1>
    <p id="explicacion">Pulse el botón para dejar de recibir correos sobre este producto. Los demás seguimientos no cambian.</p>
    <p id="resultado-enlace" class="aviso-formulario" role="status" hidden></p>
    <div class="acciones">
        <button type="button" class="boton boton-principal" id="confirmar-enlace">Sí, dejar de seguirlo</button>
        <a class="boton boton-secundario" href="usuario.html#seguimientos">Ir a Mis seguimientos</a>
    </div>
</main>
</body>
</html>
